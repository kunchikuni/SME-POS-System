name: tests

# Runs on every PR and push to protected branches.
# Pipeline: install → type-check → POS unit tests → server build → dashboard build.

on:
  push:
    branches:
      - develop
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Prisma client must be generated before tsc runs ─────────────────────
      # server/src/generated/prisma/ is .gitignored — tsc fails if it's absent.
      - name: Generate Prisma client
        run: npx prisma generate

      # ── Type checking ────────────────────────────────────────────────────────
      - name: Type-check POS
        run: npm run pos:check

      - name: Type-check dashboard
        run: npx tsc --noEmit

      - name: Type-check server
        run: npm run server:build

      # ── Unit tests ───────────────────────────────────────────────────────────
      - name: Run POS unit tests
        run: npm run pos:test

      # ── Build verification ───────────────────────────────────────────────────
      # Building the dashboard SPA confirms Vite + Rollup can bundle the full
      # dependency graph — catches import errors tsc misses (dynamic imports,
      # CSS-in-JS, asset references).
      - name: Build dashboard SPA
        run: npm run build

      - name: Build POS PWA
        run: npm run pos:build
