name: lint

# Runs on every PR and push to protected branches.
# Checks: ESLint (dashboard + server), TypeScript strict mode (all three builds).
# Fast feedback — no builds, no tests. Fails early on import errors & type regressions.

on:
  push:
    branches:
      - develop
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma generate must run before tsc — the generated client is a compile
      # dependency of server/src/lib/db.ts. Without this, tsc fails immediately
      # with "Cannot find module '.../generated/prisma'".
      - name: Generate Prisma client
        run: npx prisma generate

      # ── ESLint ───────────────────────────────────────────────────────────────
      - name: Lint dashboard (ESLint)
        run: npm run lint

      # ── TypeScript ───────────────────────────────────────────────────────────
      - name: Type-check dashboard
        run: npx tsc --noEmit

      - name: Type-check POS
        run: npm run pos:check

      - name: Type-check POS tests
        run: npm run pos:check:test

      - name: Type-check server
        # server:build compiles to dist/ — we want only the type check here, not
        # the emit. tsc -p server/tsconfig.json --noEmit is the equivalent.
        run: npx tsc -p server/tsconfig.json --noEmit
        working-directory: ${{ github.workspace }}
